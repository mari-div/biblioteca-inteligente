# Perfil de pruebas: base de datos H2 en memoria, para que `mvn test` no necesite PostgreSQL
spring.application.name=biblioteca-inteligente

spring.datasource.url=jdbc:h2:mem:biblioteca-test;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=create-drop

