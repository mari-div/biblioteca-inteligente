spring.application.name=biblioteca-inteligente

# Credenciales locales (no se suben a Git). Copia application-local.properties.example
# a application-local.properties en la raíz del proyecto y pon ahí tu contraseña.
spring.config.import=optional:file:./application-local.properties

spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/DbBibliotecaInteligente}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# JWT: el secreto (Base64, mínimo 32 bytes) va en application-local.properties
app.jwt.secret=${JWT_SECRET}
app.jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}
